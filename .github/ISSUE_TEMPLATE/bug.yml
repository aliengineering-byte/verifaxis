name: Bug report
description: Report a reproducible VerifAxis defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security issues here; use the private process in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, task/config, seed, and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, and relevant optional endpoint details without secrets.
    validations:
      required: true
