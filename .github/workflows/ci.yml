name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/verifaxis-wheel
      - run: /tmp/verifaxis-wheel/bin/pip install dist/*.whl
      - run: /tmp/verifaxis-wheel/bin/verifaxis demo
      - run: python -m venv /tmp/verifaxis-sdist
      - run: /tmp/verifaxis-sdist/bin/pip install dist/*.tar.gz
      - run: /tmp/verifaxis-sdist/bin/verifaxis demo
